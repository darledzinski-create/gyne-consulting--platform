{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Book Appointment</h1>

    <form method="POST">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <label>Patient Name</label>
        
        <input type="text"

               value="{{ consultation.name }}"

               readonly>

        <label>Email</label>

        <input type="email"

               value="{{ consultation.email }}"

               readonly>

        <label>Practice</label>

        <input type="text"

               name="practice"

               required>

        <label>Date</label>

        <input type="date"

               name="preferred_date"

               required>

        <label>Time</label>

        <input type="text"

               name="preferred_time"

               placeholder="10:30"

               required>
        
        <label>Reason</label>

        <textarea name="reason"></textarea>

        <div style="margin: 20px 0; padding: 18px; border: 1px solid #e5e7eb; border-radius: 12px; background: #f8fafc; text-align: center;">

            <strong style="font-size: 18px;">
                 Consultation Fee: R 500
            </strong>

        <p style="margin: 8px 0 0; color: #6b7280;">
            The consultation fee is R 500.
        </p>

    </div>

    <button type="submit" id="submit-btn">   
            Save Appointment
        </button>

        <script>
        document.querySelector("form").addEventListener("submit", function () {
            document.getElementById("submit-btn").disabled = true;
            document.getElementById("submit-btn").textContent = "Saving...";
        });
        </script>
        
    </form>

</div>

{% endblock %}
